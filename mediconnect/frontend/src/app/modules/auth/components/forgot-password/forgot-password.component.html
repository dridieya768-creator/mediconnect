<div class="auth-page">
  <div class="auth-card">
    <a routerLink="/auth/login" class="back-btn">← Retour</a>
    <div class="icon-circle">📧</div>
    <h2>Mot de passe oublié</h2>
    <p>Entrez votre email pour recevoir un lien de réinitialisation.</p>

    <div class="success-box" *ngIf="success">
      <div class="success-icon">✅</div>
      <strong>Lien envoyé !</strong>
      <p>{{ success }}</p>
      <div class="dev-box" *ngIf="devResetUrl">
        <span class="dev-label">🛠️ Mode développement</span>
        <a [href]="devResetUrl" class="dev-link">Cliquer ici pour réinitialiser →</a>
      </div>
    </div>

    <div class="error-box" *ngIf="error">⚠️ {{ error }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!success">
      <div class="field-group">
        <label>Adresse email</label>
        <input type="email" formControlName="email" placeholder="votre@email.com">
        <span class="field-error"
          *ngIf="form.get('email')?.touched && form.get('email')?.errors?.['email']">
          Adresse email invalide
        </span>
      </div>
      <button type="submit" [disabled]="isLoading || form.invalid">
        {{ isLoading ? "Envoi en cours..." : "Envoyer le lien" }}
      </button>
    </form>

    <div class="footer-links" *ngIf="!success">
      <a routerLink="/auth/login">← Connexion</a>
      <a routerLink="/auth/register">Créer un compte</a>
    </div>
  </div>
</div>
