<div class="auth-wrapper">

  <!-- GAUCHE : Photo -->
  <div class="auth-right">
    <img src="assets/images/consultaion2.jpg" alt="MediConnect" class="login-photo">
    <div class="photo-overlay">
      <h2>Rejoignez MediConnect</h2>
      <p>La plateforme e-sante qui connecte patients et professionnels de sante en Tunisie.</p>
    </div>
  </div>

  <!-- DROITE : Formulaire -->
  <div class="auth-left">
    <div class="auth-card">

      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="8" fill="#1a56db"/>
            <path d="M16 7v18M7 16h18" stroke="white" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="brand-name">MediConnect</span>
      </div>

      <div class="auth-tabs">
        <button class="tab-btn" routerLink="/auth/login">Connexion</button>
        <button class="tab-btn active">Inscription</button>
      </div>

      <h2 class="card-title">Créer un compte</h2>
      <p class="card-sub">Rejoignez votre espace santé</p>

      <div class="alert-error" *ngIf="error">
        <span>⚠️</span> {{ error }}
      </div>

      <!-- Bouton professionnel -->
      <button type="button" class="pro-btn" (click)="setProfessional()">
        Vous êtes professionnel de santé ?
      </button>

      <div class="divider"><span>ou saisir vos informations</span></div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="register-form">

        <!-- Genre -->
        <div class="gender-row">
          <label class="gender-opt">
            <input type="radio" formControlName="gender" value="FEMME"> Femme
          </label>
          <label class="gender-opt">
            <input type="radio" formControlName="gender" value="HOMME"> Homme
          </label>
        </div>

        <!-- Nom / Prénom -->
        <div class="row-2">
          <input class="field-input" type="text" formControlName="lastName" placeholder="Nom"/>
          <input class="field-input" type="text" formControlName="firstName" placeholder="Prénom"/>
        </div>

        <!-- Téléphone -->
        <div class="phone-row">
          <span class="phone-prefix">🇹🇳 +216</span>
          <input class="field-input phone-input" type="tel" formControlName="phone" placeholder="Ex: 50 577 742"/>
        </div>

        <!-- Email -->
        <input class="field-input" type="email" formControlName="email" placeholder="Email"/>

        <!-- Rôle -->
        <select class="field-input" formControlName="role">
          <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
        </select>

        <!-- Spécialité (si médecin spécialiste) -->
        <select class="field-input" formControlName="specialite" *ngIf="isMedecinSpecialiste">
          <option value="">-- Choisir une spécialité --</option>
          <option *ngFor="let s of specialites" [value]="s.value">{{ s.label }}</option>
        </select>

        <!-- Documents (si médecin) -->
        <div class="docs-section" *ngIf="isMedecin">
          <p class="docs-title">Documents requis (PDF, max 5MB)</p>
          <div class="doc-item" *ngFor="let doc of requiredDocs">
            <label class="doc-label">
              <span>{{ doc.icon }} {{ doc.label }}</span>
              <span class="doc-required" *ngIf="doc.required">*</span>
            </label>
            <div class="doc-upload">
              <input type="file" accept=".pdf" (change)="onFileSelected($event, doc.type)" [id]="'doc-'+doc.type" style="display:none"/>
              <label [for]="'doc-'+doc.type" class="upload-btn">
                {{ uploadedFiles[doc.type] ? '✅ ' + uploadedFiles[doc.type].name : '📎 Choisir un fichier' }}
              </label>
            </div>
          </div>
        </div>

        <!-- Mot de passe -->
        <input class="field-input" type="password" formControlName="password" placeholder="Mot de passe (min 8 caractères)"/>

        <!-- CGU -->
        <label class="cgu-row">
          <input type="checkbox" formControlName="acceptCgu"/>
          <span>J'accepte les <a href="#" class="link">CGU</a> ainsi que la <a href="#" class="link">politique de confidentialité</a></span>
        </label>

        <button type="submit" class="submit-btn" [disabled]="isLoading || form.invalid">
          <span *ngIf="!isLoading">Soumettre</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>

        <p class="login-link">Déjà un compte ? <a routerLink="/auth/login" class="link">Se connecter</a></p>

      </form>
    </div>
  </div>

</div>
